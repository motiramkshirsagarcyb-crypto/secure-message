<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receive Protected Message</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            color: #243047;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255,255,255,0.9),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 85% 75%,
                    rgba(255,255,255,0.8),
                    transparent 25%
                ),
                #fff0f4;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;

            overflow-x: hidden;

            user-select: none;
            -webkit-user-select: none;
        }


        /* ========================================
           RANDOM FLOATING SECURITY SYMBOLS
        ======================================== */

        .floating-symbol {
            position: fixed;

            color: #e987a8;

            opacity: 0.38;

            pointer-events: none;

            user-select: none;

            z-index: 0;

            font-size: 25px;

            animation: floating 5s ease-in-out infinite;
        }

        @keyframes floating {

            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-9px) rotate(4deg);
            }
        }


        .s1  { top: 8%;  left: 5%; }
        .s2  { top: 18%; left: 19%; font-size: 20px; animation-delay: .7s; }
        .s3  { top: 31%; left: 8%; }
        .s4  { top: 43%; left: 20%; font-size: 20px; animation-delay: 1s; }
        .s5  { top: 57%; left: 6%; font-size: 23px; animation-delay: 1.5s; }
        .s6  { top: 71%; left: 16%; font-size: 20px; animation-delay: .3s; }
        .s7  { top: 84%; left: 5%; }
        .s8  { top: 91%; left: 25%; font-size: 19px; animation-delay: 1.2s; }

        .s9  { top: 10%; right: 8%; }
        .s10 { top: 22%; right: 20%; font-size: 20px; animation-delay: .5s; }
        .s11 { top: 34%; right: 7%; }
        .s12 { top: 48%; right: 18%; font-size: 22px; animation-delay: 1.3s; }
        .s13 { top: 62%; right: 6%; }
        .s14 { top: 74%; right: 20%; font-size: 20px; animation-delay: .8s; }
        .s15 { top: 85%; right: 8%; }
        .s16 { top: 92%; right: 25%; font-size: 19px; animation-delay: 1.6s; }


        /* ========================================
           MAIN CARD
        ======================================== */

        .container {
            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 720px;

            background: rgba(255,255,255,0.97);

            border-radius: 18px;

            padding: 34px 36px 36px;

            box-shadow:
                0 5px 12px rgba(80,40,60,0.08),
                0 18px 45px rgba(120,60,80,0.16);

            border: 1px solid rgba(255,255,255,0.8);
        }


        /* ========================================
           WARNING
        ======================================== */

        .warning {
            display: flex;

            gap: 12px;

            align-items: flex-start;

            padding: 15px 17px;

            margin-bottom: 25px;

            border-radius: 11px;

            background: #fff7f8;

            border: 1px solid #f1cbd6;

            color: #71364b;

            font-size: 14px;

            line-height: 1.5;
        }

        .warning-icon {
            font-size: 21px;

            flex-shrink: 0;
        }

        .warning strong {
            color: #a43d5d;
        }


        /* ========================================
           HEADER
        ======================================== */

        .header {
            display: flex;

            align-items: center;

            gap: 16px;

            padding-bottom: 22px;

            margin-bottom: 25px;

            border-bottom: 1px solid #f0dfe5;
        }

        .security-icon {
            width: 62px;
            height: 62px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background: #fff0f4;

            font-size: 31px;

            box-shadow:
                inset 0 0 0 1px #f8d9e3;
        }

        h1 {
            margin: 0 0 7px;

            font-size: 32px;

            line-height: 1.15;

            color: #17233b;
        }

        .subtitle {
            margin: 0;

            color: #68758b;

            font-size: 16px;

            line-height: 1.5;
        }


        /* ========================================
           PASSWORD
        ======================================== */

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            margin-bottom: 9px;

            font-size: 15px;

            font-weight: 700;

            color: #43516a;
        }

        .password-wrapper {
            position: relative;
        }

        .password-icon {
            position: absolute;

            left: 16px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 19px;

            pointer-events: none;
        }

        input {
            width: 100%;

            height: 54px;

            padding: 0 16px 0 48px;

            border: 1px solid #d9e0ea;

            border-radius: 11px;

            background: white;

            color: #27354c;

            font-family: inherit;

            font-size: 16px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #9aa6b8;
        }

        input:focus {
            border-color: #e45d86;

            box-shadow:
                0 0 0 4px rgba(228,93,134,0.10);
        }


        /* ========================================
           UNLOCK BUTTON
        ======================================== */

        button {
            width: 100%;

            height: 54px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #e85d87,
                    #d94e79
                );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 16px rgba(217,78,121,0.24);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                filter 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 10px 22px rgba(217,78,121,0.30);

            filter: brightness(1.03);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.65;

            cursor: wait;

            transform: none;
        }

        .button-icon {
            margin-right: 9px;

            font-size: 18px;
        }


        /* ========================================
           RESULT
        ======================================== */

        #message {
            margin: 18px 0 0;

            color: #56647a;

            font-size: 14px;

            line-height: 1.6;

            overflow-wrap: anywhere;
        }

        #message.error {
            color: #c0395d;

            font-weight: 600;
        }

        #timer {
            margin-top: 12px;

            color: #d94e79;

            font-size: 15px;

            font-weight: 700;
        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 700px) {

            body {
                padding: 20px 14px;
            }

            .container {
                padding: 25px 20px 26px;

                border-radius: 15px;
            }

            .header {
                align-items: flex-start;
            }

            .security-icon {
                width: 52px;
                height: 52px;

                font-size: 27px;
            }

            h1 {
                font-size: 25px;
            }

            .subtitle {
                font-size: 14px;
            }

            .floating-symbol {
                font-size: 20px;
            }
        }
    </style>
</head>


<body
    oncontextmenu="return false"
    oncopy="return false"
    onselectstart="return false"
>


    <!-- RANDOM BACKGROUND SYMBOLS -->

    <span class="floating-symbol s1">✉</span>
    <span class="floating-symbol s2">✦</span>
    <span class="floating-symbol s3">🔒</span>
    <span class="floating-symbol s4">💬</span>
    <span class="floating-symbol s5">✧</span>
    <span class="floating-symbol s6">🔐</span>
    <span class="floating-symbol s7">✉</span>
    <span class="floating-symbol s8">✦</span>

    <span class="floating-symbol s9">🛡</span>
    <span class="floating-symbol s10">✈</span>
    <span class="floating-symbol s11">🔒</span>
    <span class="floating-symbol s12">🔑</span>
    <span class="floating-symbol s13">💬</span>
    <span class="floating-symbol s14">✧</span>
    <span class="floating-symbol s15">✉</span>
    <span class="floating-symbol s16">🔐</span>


    <!-- MAIN CARD -->

    <div class="container">


        <!-- WARNING -->

        <div class="warning">

            <div class="warning-icon">
                ⚠️
            </div>

            <div>
                <strong>Confidential message</strong><br>

                This message is protected and will automatically
                expire after its allowed time.
            </div>

        </div>


        <!-- HEADER -->

        <div class="header">

            <div class="security-icon">
                🔐
            </div>

            <div>

                <h1>
                    Receive Protected Message
                </h1>

                <p class="subtitle">
                    Enter the password provided by the sender
                    to unlock this message.
                </p>

            </div>

        </div>


        <!-- PASSWORD ONLY -->

        <div class="form-group">

            <label for="password">
                Message Password
            </label>

            <div class="password-wrapper">

                <span class="password-icon">
                    🔑
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="off"
                >

            </div>

        </div>


        <!-- UNLOCK -->

        <button
            id="unlockButton"
            onclick="unlockMessage()"
        >
            <span class="button-icon">🔓</span>
            Unlock Protected Message
        </button>


        <!-- RESULT -->

        <p id="message"></p>

        <p id="timer"></p>


    </div>


    <script>

        let timerInterval;


        /*
         * The Message ID is now taken ONLY from the
         * private URL parameter.
         *
         * It is never displayed on the page.
         */

        const urlParams =
            new URLSearchParams(window.location.search);

        const messageId =
            urlParams.get("id");


        async function unlockMessage() {

            const password =
                document.getElementById("password").value;

            const messageElement =
                document.getElementById("message");

            const timerElement =
                document.getElementById("timer");

            const button =
                document.getElementById("unlockButton");


            /* Check that this is a valid message link */

            if (!messageId) {

                messageElement.className = "error";

                messageElement.textContent =
                    "This message link is invalid or incomplete.";

                return;
            }


            /* Check password */

            if (!password) {

                messageElement.className = "error";

                messageElement.textContent =
                    "Please enter the message password.";

                return;
            }


            /* Loading state */

            messageElement.className = "";

            messageElement.textContent =
                "Unlocking protected message...";

            timerElement.textContent = "";

            button.disabled = true;


            try {

                const response = await fetch(
                    `/api/messages/${encodeURIComponent(messageId)}/unlock`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            password: password
                        })
                    }
                );


                const data =
                    await response.json();


                if (!response.ok) {

                    messageElement.className = "error";

                    messageElement.textContent =
                        data.error ||
                        "Could not unlock message.";

                    button.disabled = false;

                    return;
                }


                /*
                 * Store the unlocked message temporarily.
                 */

                sessionStorage.setItem(
                    "unlockedMessage",
                    data.message
                );


                sessionStorage.setItem(
                    "messageExpiresAt",
                    data.expiresAt
                );


                /*
                 * Move to the separate message page.
                 */

                window.location.href =
                    "/message.html";


            } catch (error) {

                messageElement.className = "error";

                messageElement.textContent =
                    "Could not connect to the server.";

                button.disabled = false;
            }
        }


        /*
         * Existing timer function retained.
         */

        function startTimer(expiresAt) {

            clearInterval(timerInterval);


            function updateTimer() {

                const remaining =
                    expiresAt - Date.now();


                if (remaining <= 0) {

                    clearInterval(timerInterval);

                    document.getElementById("message")
                        .textContent =
                        "This message has expired.";

                    document.getElementById("timer")
                        .textContent = "";

                    return;
                }


                const totalSeconds =
                    Math.ceil(remaining / 1000);


                const minutes =
                    Math.floor(totalSeconds / 60);


                const seconds =
                    totalSeconds % 60;


                document.getElementById("timer")
                    .textContent =
                    `⏱️ Time remaining: ${minutes}:${seconds
                        .toString()
                        .padStart(2, "0")}`;
            }


            updateTimer();


            timerInterval =
                setInterval(updateTimer, 1000);
        }

    </script>

</body>
</html>
