<html>
<head>
<style>

    -webkit-user-select: none;

    max-width: 600px;

    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.warning {

    background: #fef2f2;

    border-radius: 8px;

    line-height: 1.5;
}

    border: 1px solid #dc2626;
    background: #fef2f2;
    color: #991b1b;

}

input {
    width: 100%;

</style>    <meta charset="UTF-8">
    <title>Receive Protected Message</title>
</head>

<body oncontextmenu="return false" oncopy="return false" onselectstart="return false">
<div class="container">
<div style="padding: 15px; border: 2px solid red; margin-bottom: 20px;">
    ⚠️ <strong>WARNING:</strong> Do not screenshot, screen record, copy, or share this message.
    This message is confidential and will automatically expire.
</div>

    <h1>🔐 Receive Protected Message</h1>

    <p>Enter the Message ID you received.</p>

    <input
        type="text"
        id="messageId"
        placeholder="Message ID"
        size="50">

    <br><br>

    <input
        type="password"
        id="password"
        placeholder="Password">

    <br><br>

    <button onclick="unlockMessage()">
        Unlock Message
    </button>

    <h2 id="messageTitle"></h2>

    <p id="message"></p>

    <p id="timer"></p>

    <script>

        let timerInterval;
const urlParams = new URLSearchParams(window.location.search);

window.addEventListener("DOMContentLoaded", () => {
    const id = urlParams.get("id");

    if (id) {
        document.getElementById("messageId").value = id;
    }
});

        async function unlockMessage() {

            const urlParams = new URLSearchParams(window.location.search);

const id =
    urlParams.get("id") ||
    document.getElementById("messageId").value.trim();

if (urlParams.get("id")) {
    document.getElementById("messageId").value =
        urlParams.get("id");
}

            const password =
                document.getElementById("password").value;

            const messageElement =
                document.getElementById("message");

            const timerElement =
                document.getElementById("timer");

            if (!id || !password) {
                messageElement.textContent =
                    "Please enter the Message ID and password.";
                return;
            }

            messageElement.textContent =
                "Unlocking...";

            try {

                const response = await fetch(
                    `/api/messages/${encodeURIComponent(id)}/unlock`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    messageElement.textContent =
                        data.error || "Could not unlock message.";

                    timerElement.textContent = "";

                    return;
                }

                document.getElementById("messageTitle")
                    .textContent = "Your Message:";

                messageElement.textContent =
                    data.message;

                startTimer(data.expiresAt);

            } catch (error) {

                messageElement.textContent =
                    "Could not connect to the server.";
            }
        }

        function startTimer(expiresAt) {

            clearInterval(timerInterval);

            function updateTimer() {

                const remaining =
                    expiresAt - Date.now();

                if (remaining <= 0) {

                    clearInterval(timerInterval);

                    document.getElementById("message")
                        .textContent =
                        "This message has expired.";

                    document.getElementById("timer")
                        .textContent = "";

                    return;
                }

                const totalSeconds =
                    Math.ceil(remaining / 1000);

                const minutes =
                    Math.floor(totalSeconds / 60);

                const seconds =
                    totalSeconds % 60;

                document.getElementById("timer")
                    .textContent =
                    `⏱️ Time remaining: ${minutes}:${seconds
                        .toString()
                        .padStart(2, "0")}`;
            }

            updateTimer();

            timerInterval =
                setInterval(updateTimer, 1000);
        }

    

</script>

</div>
</body>
</html>
