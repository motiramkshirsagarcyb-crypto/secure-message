<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Protected Messaging</title>
</head>
<body>

    <h1>Password Protected Messaging</h1>

    <h2>Send a Protected Message</h2>

    <textarea
        id="message"
        rows="8"
        cols="50"
        placeholder="Enter your message">
    </textarea>

    <br><br>

    <input
        type="password"
        id="password"
        placeholder="Enter password">

    <br><br>

    <button>Create Protected Message</button>

</body>
</html>
